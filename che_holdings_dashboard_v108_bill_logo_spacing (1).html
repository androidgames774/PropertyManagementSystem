/* Issued electricity bills: dedicated layout identical in structure to electricity module */
.electricity-sheet{max-width:1050px;margin:18px auto;background:#fff;padding:30px 34px;color:#172b46;border:1px solid #dbe5ef;border-radius:14px;font-family:Arial,system-ui,sans-serif}
.electricity-sheet .elec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;border-bottom:1px solid #e2e8f0;padding-bottom:22px}
.electricity-sheet .elec-tag{display:block;color:#2563a6;font-size:21px;font-weight:750;margin-bottom:14px}
.electricity-sheet .elec-top h2{font-size:17px;margin:0 0 10px;color:#243d60}
.electricity-sheet .elec-top p{margin:0;color:#63738b;font-size:13px}
.electricity-sheet .elec-dates{min-width:230px}.electricity-sheet .elec-dates div{display:flex;justify-content:space-between;gap:18px;margin:0 0 12px;font-size:13px}.electricity-sheet .elec-dates span{color:#6b7788}
.electricity-sheet .elec-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}
.electricity-sheet .elec-three>div,.electricity-sheet .elec-equation>div{background:#f2f6fb;padding:16px;border-radius:10px;text-align:center}
.electricity-sheet small{display:block;font-size:12px;color:#64748b;margin-bottom:9px}.electricity-sheet .elec-three b{display:block;font-size:15px}
.electricity-sheet .elec-equation{display:grid;grid-template-columns:minmax(0,1fr) 25px minmax(0,1fr) 25px minmax(0,1fr);align-items:center;gap:8px;margin:20px 0 26px;text-align:center}
.electricity-sheet .elec-equation>div{background:#eaf2fb}.electricity-sheet .elec-equation strong{display:block;font-size:28px;color:#173e70}.electricity-sheet .elec-equation>b{font-size:26px;color:#68819f}
.electricity-sheet .elec-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.electricity-sheet .elec-card{border:1px solid #dfe7f0;border-radius:12px;padding:19px;background:#fff}
.electricity-sheet .elec-card h3{font-size:15px;margin:0 0 16px;color:#244c79}.electricity-sheet .elec-charge,.electricity-sheet .elec-total{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #e6edf5;font-size:13px}.electricity-sheet .elec-total{background:#eaf3ff;padding:14px 12px;border-radius:7px;margin-top:10px;border:0;font-size:17px;color:#173f71}
.electricity-sheet .elec-formulas{background:#f5f8fc;padding:12px;border-radius:8px;font-size:12px;line-height:1.7;margin-bottom:22px}.electricity-sheet .elec-formulas div{margin-bottom:9px}.electricity-sheet .elec-notes{font-size:13px;line-height:1.7;color:#64748b;white-space:pre-wrap}
@media(max-width:700px){.electricity-sheet{padding:15px}.electricity-sheet .elec-columns{grid-template-columns:1fr}.electricity-sheet .elec-top{flex-direction:column}.electricity-sheet .elec-equation strong{font-size:20px}}
@media print{.electricity-sheet{border:0!important;box-shadow:none!important;max-width:none!important;padding:0!important;margin:0!important;break-inside:avoid}.electricity-sheet .elec-columns{grid-template-columns:1fr 1fr!important}.electricity-sheet .elec-three{grid-template-columns:repeat(3,1fr)!important}.electricity-sheet .elec-equation{grid-template-columns:minmax(0,1fr) 25px minmax(0,1fr) 25px minmax(0,1fr)!important}body:has(.electricity-sheet) header,body:has(.electricity-sheet) nav{display:none!important}}
.doc-tabs{display:flex;gap:4px;border-bottom:1px solid #dce3ec;margin:18px 0 14px}.doc-tabs button{border-radius:8px 8px 0 0;background:transparent;color:#42526a;border:1px solid transparent;border-bottom:0;padding:11px 22px}.doc-tabs button.selected{background:#eaf0fb;color:#183f79;font-weight:700;border-color:#dce3ec}.cancelled-watermark{font-size:32px;font-weight:800;letter-spacing:5px;color:#a32222;text-align:center;border:4px double #a32222;padding:12px;margin:12px 0}@media print{.cancelled-watermark{color:#a32222!important;print-color-adjust:exact}} .issuer-label{font-size:12px;font-weight:600;color:#53647a;margin:4px 0 10px}
/* Theme system: applies to UI and printable invoices/bills */
:root{--theme-dark:#17253a;--theme-accent:#244c85;--theme-pale:#eaf2fb;--theme-ink:#173e70}
html[data-che-theme="navy"]{--theme-dark:#17253a;--theme-accent:#244c85;--theme-pale:#eaf2fb;--theme-ink:#173e70}
html[data-che-theme="forest"]{--theme-dark:#163b33;--theme-accent:#25735a;--theme-pale:#e9f5ef;--theme-ink:#1d5b49}
html[data-che-theme="burgundy"]{--theme-dark:#442535;--theme-accent:#854362;--theme-pale:#f8edf2;--theme-ink:#743451}
html[data-che-theme="slate"]{--theme-dark:#29343d;--theme-accent:#506777;--theme-pale:#edf2f5;--theme-ink:#344d5e}
html[data-che-theme="sand"]{--theme-dark:#493c30;--theme-accent:#927044;--theme-pale:#f7f0e5;--theme-ink:#76552f}

html[data-che-theme] .header,html[data-che-theme] .nav button.active{background:var(--theme-dark)}
html[data-che-theme] button:not(.alt):not(.danger):not(.selected):not(.active){background:var(--theme-accent);border-color:var(--theme-accent)}
html[data-che-theme] button.alt{color:var(--theme-accent);border-color:var(--theme-accent)}
html[data-che-theme] .tabs button.active,html[data-che-theme] .doc-tabs button.selected{background:var(--theme-accent);color:white}
html[data-che-theme] .category-pill,html[data-che-theme] .module-card,html[data-che-theme] .invoice-info,html[data-che-theme] .electricity-sheet .elec-three>div,html[data-che-theme] .electricity-sheet .elec-equation>div,html[data-che-theme] .electricity-sheet .elec-formulas,html[data-che-theme] .electricity-sheet .elec-total{background:var(--theme-pale)}
html[data-che-theme] .electricity-sheet .elec-tag,html[data-che-theme] .electricity-sheet .elec-card h3,html[data-che-theme] .electricity-sheet .elec-equation strong,html[data-che-theme] .electricity-sheet .elec-total{color:var(--theme-ink)}
html[data-che-theme] .electricity-sheet .elec-top h2{color:var(--theme-dark)}
html[data-che-theme] .category-pill{color:var(--theme-ink)}
.theme-picker{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}.theme-picker label{margin:0;color:#fff;font-size:13px}.theme-picker select{width:auto;min-width:160px;padding:7px 10px;border:1px solid #ffffff66;background:#fff;color:#17253a}
@media print{html[data-che-theme] .electricity-sheet .elec-three>div,html[data-che-theme] .electricity-sheet .elec-equation>div,html[data-che-theme] .electricity-sheet .elec-formulas,html[data-che-theme] .electricity-sheet .elec-total,html[data-che-theme] .invoice-info{background:var(--theme-pale)!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}html[data-che-theme] .electricity-sheet .elec-tag,html[data-che-theme] .electricity-sheet .elec-card h3,html[data-che-theme] .electricity-sheet .elec-equation strong{color:var(--theme-ink)!important;print-color-adjust:exact!important}.theme-picker{display:none!important}}


.water-inline-preview{margin:24px 0 18px;border-top:1px solid var(--border,#d8e0e9);padding-top:22px}.water-inline-preview .toolbar{align-items:end}.water-inline-preview .toolbar select{min-width:220px}.water-inline-sheet{margin:16px auto;max-width:980px}.water-inline-sheet .electricity-sheet{margin:auto}.water-inline-actions{justify-content:flex-end;gap:10px}@media(max-width:650px){.water-inline-preview .toolbar{display:block}.water-inline-preview .toolbar select{width:100%}}
.water-confirm-cell{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:8px;padding:0 0 3px;align-self:start}.water-confirm-cell button{width:100%;min-height:45px}@media(max-width:650px){.water-confirm-cell{width:100%}}\n
/* Coordinated invoice layout, screen and print */
.invoice-sheet{--inv-accent:var(--theme-accent,#244c85);--inv-dark:var(--theme-dark,#17253a);--inv-pale:var(--theme-pale,#eaf2fb);background:#fff;color:var(--inv-dark);border:1px solid #dce5ef;border-radius:14px;padding:30px 34px;margin:18px 0;font-family:Arial,system-ui,sans-serif}
.invoice-doc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-bottom:1px solid #dce5ef;padding-bottom:20px;margin-bottom:20px}
.invoice-doc-top h2{color:var(--inv-accent);font-size:22px;margin:0 0 10px}
.invoice-doc-top .issuer-label{color:var(--inv-dark);margin:0 0 10px}
.invoice-number{color:var(--inv-accent);font-weight:700;font-size:14px}
.invoice-doc-dates{min-width:235px;display:grid;gap:11px;font-size:13px}
.invoice-doc-dates>div{display:flex;justify-content:space-between;gap:24px}
.invoice-doc-dates span{color:#62748b}.invoice-doc-dates b{color:var(--inv-dark)}
.invoice-sheet h3{color:var(--inv-accent)}
.invoice-sheet .table{table-layout:fixed;width:100%;border-collapse:collapse}
.invoice-sheet .table th,.invoice-sheet .table td{vertical-align:middle}
.invoice-sheet .table th:nth-child(1),.invoice-sheet .table td:nth-child(1){width:46%}
.invoice-sheet .table th:nth-child(2),.invoice-sheet .table td:nth-child(2){width:10%;text-align:center}
.invoice-sheet .table th:nth-child(3),.invoice-sheet .table td:nth-child(3){width:20%;text-align:right;font-variant-numeric:tabular-nums}
.invoice-sheet .table th:nth-child(4),.invoice-sheet .table td:nth-child(4){width:24%;text-align:right;font-variant-numeric:tabular-nums}
.invoice-sheet .table thead{background:var(--inv-pale)}
.invoice-sheet .table th{color:var(--inv-dark)}
.invoice-sheet .table td{border-color:#dce5ef}
.invoice-sheet .table+h2{text-align:right;color:var(--inv-accent);background:var(--inv-pale);padding:12px 14px;border-radius:8px}
@media(max-width:650px){.invoice-sheet{padding:16px}.invoice-doc-top{flex-direction:column}.invoice-doc-dates{width:100%}.invoice-sheet .table th,.invoice-sheet .table td{padding:7px 4px;font-size:11px}}
@media print{.invoice-sheet{border:0!important;margin:0!important;padding:0!important;max-width:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-sheet .table thead,.invoice-sheet .table+h2{background:var(--inv-pale)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-doc-top,.invoice-sheet .table tr{break-inside:avoid}}

/* Restrained invoice palette: nearly white, fine neutral lines, small theme accents. */
html[data-che-theme] .invoice-sheet{--inv-accent:var(--theme-accent);--inv-dark:var(--theme-dark);--inv-pale:var(--theme-pale);--inv-ink:var(--theme-ink);border:1px solid #e2e8ef}
html[data-che-theme] .invoice-doc-top{border-bottom:1px solid #e3e8ee}
html[data-che-theme] .invoice-doc-top h2{color:var(--inv-dark)}
html[data-che-theme] .invoice-doc-dates{background:color-mix(in srgb,var(--inv-pale) 14%,white);border:1px solid #e5eaf0;border-radius:7px;padding:10px 13px;min-width:255px}
html[data-che-theme] .invoice-doc-dates>div+div{border-top:1px solid #eef1f5;padding-top:8px}
html[data-che-theme] .invoice-doc-dates>div:first-child b{color:var(--inv-accent)}
html[data-che-theme] .invoice-sheet .grid>div{border:0;border-radius:0;padding:2px 4px;margin:0 0 14px;background:white}
html[data-che-theme] .invoice-sheet .grid h3{color:var(--inv-dark);margin:0 0 12px}
html[data-che-theme] .invoice-sheet .table{border:0}
html[data-che-theme] .invoice-sheet .table thead{background:color-mix(in srgb,var(--inv-pale) 19%,white)}
html[data-che-theme] .invoice-sheet .table th{color:var(--inv-dark);border-bottom:1px solid #dce5ed}
html[data-che-theme] .invoice-sheet .table tbody tr:nth-child(even){background:white}
html[data-che-theme] .invoice-sheet .table+h2{background:color-mix(in srgb,var(--inv-pale) 20%,white);color:var(--inv-dark);border:0;border-radius:5px}
@media print{html[data-che-theme] .invoice-sheet{border:0!important;padding-top:0!important}html[data-che-theme] .invoice-doc-dates,html[data-che-theme] .invoice-sheet .table thead,html[data-che-theme] .invoice-sheet .table+h2{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}html[data-che-theme] .invoice-sheet .grid{grid-template-columns:1fr 1fr!important}}
.issuer-address{font-size:12px;color:#617085;line-height:1.5;margin-top:3px;white-space:pre-line}\n
/* Keep issuer identity as a single vertically aligned document-header block. */
.invoice-sheet .issuer-label,.electricity-sheet .issuer-label{margin:7px 0 0!important;padding:0!important;line-height:1.45}
.invoice-sheet .issuer-address,.electricity-sheet .issuer-address{margin:2px 0 10px!important;padding:0!important;line-height:1.45;color:#617085;font-size:12px;white-space:pre-line;text-align:left}
.invoice-sheet .issuer-label+.issuer-address,.electricity-sheet .issuer-label+.issuer-address{margin-left:0!important}
.issuer-identity{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:5px;align-items:start;margin:7px 0 10px}.issuer-identity .issuer-prefix{line-height:1.45;font-size:12px;font-weight:600}.issuer-identity .issuer-label{margin:0!important}.issuer-identity .issuer-address{margin:2px 0 0!important;padding:0!important}.issuer-identity-details{min-width:0}

/* Keep content above the centered seal; translucent surfaces let it show through. */
.invoice-sheet > *,.electricity-sheet > *{position:relative;z-index:1}
.invoice-sheet :is(th,td,.panel,.meta,.summary,.total,.bill-panel,.info-card),
.electricity-sheet :is(th,td,.panel,.meta,.summary,.total,.bill-panel,.info-card){
 background-color:rgba(246,249,252,.76);
}
@media print{
 .invoice-sheet :is(th,td,.panel,.meta,.summary,.total,.bill-panel,.info-card),
 .electricity-sheet :is(th,td,.panel,.meta,.summary,.total,.bill-panel,.info-card){
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
 }
}

/* Document surfaces only: translucent backgrounds, fully opaque text and numbers. */
.invoice-sheet :is(.invoice-doc-dates,.grid>div,.table thead,.table th,.table td,.table+h2),
.electricity-sheet :is(.elec-three>div,.elec-equation>div,.elec-card,.elec-total,.elec-formulas){
 background-color:rgba(242,247,252,.56)!important;
 background-image:none!important;
}
.invoice-sheet .table tbody :is(td,th),.electricity-sheet .elec-card{
 background-color:rgba(255,255,255,.32)!important;
}
.invoice-sheet :is(.invoice-doc-top,.grid,.table,.table tr),
.electricity-sheet :is(.elec-top,.elec-three,.elec-equation,.elec-columns){opacity:1!important}
@media print{
 .invoice-sheet :is(.invoice-doc-dates,.grid>div,.table thead,.table th,.table td,.table+h2),
 .electricity-sheet :is(.elec-three>div,.elec-equation>div,.elec-card,.elec-total,.elec-formulas){
  background-color:rgba(242,247,252,.56)!important;background-image:none!important;
  print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;
 }
 .invoice-sheet .table tbody :is(td,th),.electricity-sheet .elec-card{background-color:rgba(255,255,255,.32)!important}
}

/* Bill recipient name and address align after the Bill to: label. */
.electricity-sheet .bill-recipient{margin-top:7px;margin-bottom:3px}
.electricity-sheet .bill-recipient .issuer-prefix{min-width:65px}
.electricity-sheet .bill-recipient .issuer-identity-details{min-width:0}

/* Bill header: recipient on left; issuer and bill number on right. */
.electricity-sheet .elec-dates .bill-number-right{display:flex;justify-content:flex-end;gap:12px;align-items:baseline;margin-bottom:9px}
.electricity-sheet .elec-dates .bill-number-right span{font-size:12px;color:#617085}
.electricity-sheet .elec-dates .bill-issuer-right{margin:0 0 12px;text-align:right}
.electricity-sheet .elec-dates .bill-issuer-right .issuer-identity{justify-content:flex-end;text-align:left;display:inline-flex}

  const finish=value=>{layer.classList.remove('open');ok.onclick=null;cancel.onclick=null;inp.onkeydown=null;resolve(value)};

 });

function submitNewUnit(e){e.preventDefault();const values=Object.fromEntries(new FormData(e.target)),name=String(values.name||'').trim(),err=$('unitError');if(!name){err.textContent='Please enter a unit name.';err.classList.remove('hidden');return}if(db.units.some(u=>u.name.toLowerCase()===name.toLowerCase())){err.textContent='A unit with this name already exists.';err.classList.remove('hidden');return}if(values.managerId&&!manager(values.managerId)){err.textContent='Please select a valid manager.';err.classList.remove('hidden');return}db.units.push({id:'UNT-'+String(db.nextUnit++).padStart(3,'0'),name,managerId:values.managerId||''});save();page='units';render()}

function saveManagerDetails(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),name=String(v.name||'').trim(),error=$('managerError');if(!name){error.textContent='Manager name is required.';error.classList.remove('hidden');return}if(db.managers.some(m=>m.id!==editingManager&&m.name.toLowerCase()===name.toLowerCase())){error.textContent='A owner with this name already exists.';error.classList.remove('hidden');return}const m=manager(editingManager);if(m)Object.assign(m,v,{name});else db.managers.push({id:'MGR-'+String(db.nextManager++).padStart(3,'0'),...v,name});save();editingManager='';page='managers';render()}
function profile(){const t=tenant();if(!t)return go('tenants');const tabs=['Business','Contact & Address','Lease','Management','Miscellaneous','Utility Allocation','Billing & Invoices'];let content='';const input=(label,key,type='text')=>`<label>${label}</label><input name="${key}" type="${type}" value="${esc(t[key]??'')}" ${key==='name'||key==='unit'?'required':''}>`;const area=(label,key)=>`<label>${label}</label><textarea name="${key}" rows="3">${esc(t[key]??'')}</textarea>`;if(section==='Business')content=input('Tenant Display Name','name')+input('Registered / Billing Name','billingName')+`<label>Assigned Unit</label><select name="unitId" required>${db.units.map(u=>`<option value="${u.id}" ${t.unitId===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`;if(section==='Contact & Address')content=input('Contact Person','contact')+input('Telephone / Mobile','phone')+input('Email Address','email','email')+area('Billing Address','address');if(section==='Lease')content=input('Monthly Rent (LKR)','rent','number')+input('Security Deposit (LKR)','deposit','number')+input('Lease Start','start','date')+input('Lease End','end','date')+area('Rent Increments / Concessions / Renewal Notes','leaseNotes');if(section==='Management'){const u=unit(t.unitId);content=`<label>Property Owner (automatically inherited from unit)</label><div class="notice">${esc(manager(u?.managerId)?.name||'Not assigned')}</div><p>Assigned unit: ${esc(u?.name||'No unit selected')}. To change the owner, go to Units on the dashboard. This field is read-only.</p>`;}if(section==='Miscellaneous')content=area('Additional Notes','notes');if(section==='Utility Allocation')content=`<h3>Water Supply Allocation</h3><p class="muted">Choose a tank created under Billing → Water Billing. This assignment determines which tank's monthly water bill includes this tenant.</p><label>Assigned Water Tank</label><select name="waterTankId"><option value="">— No water tank assigned —</option>${db.waterTanks.map(w=>`<option value="${esc(w.id)}" ${t.waterTankId===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select><label>Tenant Water Meter Number</label><input name="waterMeter" value="${esc(t.waterMeter||'')}" placeholder="e.g. WM-001"><p class="muted">Water meter readings are entered in Water Billing. Existing issued bills retain their original allocation details.</p>`;if(section==='Billing & Invoices')content=`<div class="toolbar"><div><h3 style="margin:0">${directoryKind==='bill'?'Bills':'Invoices'} for ${esc(t.name)}</h3><p class="muted" style="margin:5px 0 0">View tenant financial records by type</p><div class="actions"><button type="button" class="${directoryKind==='invoice'?'':'alt'}" onclick="directoryKind='invoice';render()">Invoices</button><button type="button" class="${directoryKind==='bill'?'':'alt'}" onclick="directoryKind='bill';render()">Bills</button></div></div></div>${billDirectory(t.id)}`;$('app').innerHTML=`<section class="panel"><button class="alt" onclick="selected='';render()">← Tenant Directory</button><div class="toolbar" style="margin-top:18px"><div><h2 style="margin:0 0 5px">${esc(t.name)}</h2><p style="margin:0">${t.id} · ${esc(t.unit)} · ${t.status}</p></div><div class="actions"><button type="button" onclick="openBilling('${t.id}')">Billing</button><button type="button" onclick="startInvoice('${t.id}')">+ Generate Invoice</button></div></div><div class="tabs">${tabs.map(x=>`<button class="${section===x?'active':''}" onclick="section='${x}';render()">${x}</button>`).join('')}</div>${section==='Billing & Invoices'||section==='Management'?content:`<form onsubmit="saveProfile(event)">${content}<div class="actions"><button type="submit">Save Changes</button></div></form>`}</section><section class="panel"><h2>Tenant Management</h2><div class="actions">${t.status==='Active'?'<button class="alt" onclick="archiveTenant()">Archive Tenant</button>':'<button class="alt" onclick="restoreTenant()">Restore Tenant</button>'}<button class="danger" ${t.history?'disabled title="Financial history exists"':''} onclick="deleteTenant()">Permanently Delete</button></div>${t.history?'<p>Deletion is disabled for sample tenants with financial history.</p>':''}</section>`}
function saveProfile(e){e.preventDefault();const t=tenant(),values=Object.fromEntries(new FormData(e.target));if('rent'in values||'deposit'in values){for(const k of ['rent','deposit'])if(k in values){values[k]=Number(values[k]||0);if(!Number.isFinite(values[k])||values[k]<0)return appNotice('Invalid '+k)}}if(values.start&&values.end&&values.start>values.end)return appNotice('Lease end must follow lease start');if(values.unitId){const u=unit(values.unitId);if(!u)return appNotice('Select a valid unit');values.unit=u.name;}if('waterTankId' in values){if(values.waterTankId&&!db.waterTanks.some(w=>w.id===values.waterTankId))return appNotice('Select a valid water tank');const old=t.waterTankId||'';if(old!==values.waterTankId){const p=waterPeriod();if(p.confirmed&&Object.keys(p.tanks||{}).some(id=>p.tanks[id]?.readings?.[t.id]?.confirmed))return appNotice('This tenant has confirmed readings for the current water billing month. Change the tank after closing the billing period.');for(const w of db.waterTanks)w.tenantIds=(w.tenantIds||[]).filter(id=>id!==t.id);const chosen=db.waterTanks.find(w=>w.id===values.waterTankId);if(chosen){chosen.tenantIds=chosen.tenantIds||[];chosen.tenantIds.push(t.id)}}}Object.assign(t,values);save();render();appToast('Changes saved')}
async function archiveTenant(){if(await appConfirm('Archive tenant? Records will be retained.')){tenant().status='Archived';save();render()}}function restoreTenant(){tenant().status='Active';save();render()}async function deleteTenant(){if(tenant().history)return appNotice('Cannot delete a tenant with financial history');if(await appConfirm('Permanently delete this tenant?')){db.tenants=db.tenants.filter(t=>t.id!==selected);save();selected='';render()}}

ly; text stays fully opaque. */\n.bill-sheet :is(.bill-top,.bill-grid,.bill-panel,.reading-box,.summary-box,.charge-card,.formula-box,th,td),\n.bill-sheet :is(.elec-three>div,.elec-equation>div,.elec-card,.elec-total,.elec-formulas){\n background-color:rgba(242,247,252,.56)!important;background-image:none!important;\n}\n.bill-sheet :is(td,.elec-card){background-color:rgba(255,255,255,.32)!important}\n@media print{.bill-sheet :is(.bill-panel,.reading-box,.summary-box,.charge-card,.formula-box,th,td,.elec-three>div,.elec-equation>div,.elec-card,.elec-total,.elec-formulas){print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}\n\n/* Bill recipient name and address align after the Bill to: label. */\n.electricity-sheet .bill-recipient{margin-top:7px;margin-bottom:3px}\n.electricity-sheet .bill-recipient .issuer-prefix{min-width:65px}\n.electricity-sheet .bill-recipient .issuer-identity-details{min-width:0}\n.bill-top .issue-box{min-width:230px}.bill-top .issue-box .bill-number-right{display:flex;justify-content:flex-end;gap:12px;margin-bottom:10px}.bill-top .issue-box .bill-issuer-right{margin-bottom:12px;text-align:right}.bill-top .issue-box .bill-issuer-right .issuer-identity{display:inline-flex;text-align:left}.bill-top .issue-box .bill-issuer-right .issuer-identity-details{text-align:left}\n\n/* Bill issuer: label alongside owner name, address directly below the name. */\n.bill-issuer-right .issuer-identity{display:grid!important;grid-template-columns:max-content minmax(0,1fr)!important;column-gap:5px!important;align-items:start!important;justify-content:end!important;text-align:left!important}\n.bill-issuer-right .issuer-identity-details{display:block!important;text-align:left!important}\n.bill-issuer-right .issuer-identity-details .issuer-address{display:block!important;margin:2px 0 0!important;padding:0!important;text-align:left!important;white-space:pre-line!important}\n\n.bill-top .issue-box{display:grid!important;grid-template-columns: (85px,1fr) minmax(112px,auto)!important;column-gap:14px!important;justify-content:unset!important;text-align:left!important}.issue-box>div:not(.bill-issuer-right)>:last-child{text-align:right!important;justify-self:end!important;white-space:nowrap!important}<\/style><style id=\"cheEmbeddedTheme\">:root{--che-dark:#17253a;--che-accent:#244c85;--che-pale:#eaf2fb;--che-ink:#173e70}button:not(.danger){background:var(--che-accent)!important}h1,h2,h3{color:var(--che-ink)}.summary-card,.mini-card,.chip,.bill-panel{background:var(--che-pale)!important}.bill-sheet{border-top:4px solid var(--che-accent)}@media print{.bill-sheet{border-top:4px solid var(--che-accent)!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}.bill-panel,.chip{background:var(--che-pale)!important;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}<\/style><style id=\"che-internal-modal-css\">#che-electric-modal{position:fixed;inset:0;background:#111b2bb0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px}#che-electric-modal.visible{display:flex}#che-electric-modal>div{background:#fff;color:#18263b;border-radius:12px;padding:22px;max-width:410px;width:100%;box-shadow:0 12px 40px #0004}#che-electric-modal p{line-height:1.5;white-space:pre-wrap}#che-electric-modal footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}#che-electric-modal button{padding:9px 16px;border-radius:7px} @media print{#che-electric-modal{display:none!important}}<\/style><\/head>\n<body><div id=\"che-electric-modal\" role=\"dialog\" aria-modal=\"true\"><div><h3>Confirm action<\/h3><p id=\"che-electric-modal-message\"><\/p><footer><button id=\"che-electric-modal-cancel\" type=\"button\">Cancel<\/button><button id=\"che-electric-modal-accept\" type=\"button\">Confirm<\/button><\/footer><\/div><\/div>\n  <header class=\"app-header\">\n    <div>\n      <h1>Tenant Electricity Bill Generator<\/h1>\n      <p>Enter readings, allocate fixed charges proportionally, and print each bill as PDF.<\/p>\n    <\/div>\n    <div class=\"header-actions no-print\">\n      \n      <button id=\"saveBtn\" type=\"button\">Save Draft<\/button>\n      <span id=\"saveStatus\" class=\"help\" style=\"margin-left:8px;\"><\/span>\n      <button id=\"exportCsvBtn\" type=\"button\">Export CSV<\/button>\n    <\/div>\n  <\/header>\n\n  <main class=\"layout\">\n    <section class=\"panel no-print\">\n      <h2>Settings<\/h2>\n      <div class=\"grid two-col\">\n        <label>\n          <span>Property / Building<\/span>\n          <input id=\"propertyName\" type=\"text\" />\n        <\/label>\n        <label>\n          <span>Commercial Unit Price (Rs/kWh)<\/span>\n          <input id=\"unitPrice\" type=\"number\" min=\"0\" step=\"0.01\" />\n        <\/label>\n        <label>\n          <span>Total Fixed Charge (Rs.)<\/span>\n          <input id=\"fixedCharge\" type=\"number\" min=\"0\" step=\"0.01\" />\n        <\/label>\n        <label>\n          <span>Total SSC Levy (Rs.)<\/span>\n          <input id=\"sscRate\" type=\"number\" min=\"0\" step=\"0.01\" />\n        <\/label>\n        <label>\n          <span>Payment Due Days<\/span>\n          <input id=\"dueDays\" type=\"number\" min=\"0\" step=\"1\" />\n        <\/label>\n      <\/div>\n      <label class=\"mt-12\">\n        <span>Bill Notes<\/span>\n        <textarea id=\"billNotes\" rows=\"3\"><\/textarea>\n      <\/label>\n      <p class=\"help\">Formula: Energy Charge = Units × Unit Price. Fixed Share = Fixed Charge × (Tenant Units / Total Building Units). SSC Levy Share = Total SSC Levy × (Tenant Units / Total Building Units).<\/p>\n    <\/section>\n\n    <section class=\"panel no-print\">\n      <div class=\"panel-title-row\">\n        <h2>Tenant Readings<\/h2>\n        <span class=\"help\">Tenant details are synchronized from CHE Holdings.<\/span>\n      <\/div>\n      <div class=\"grid two-col\" style=\"margin:14px 0\"><label><span>Common Start Date<\/span><input id=\"commonStartDate\" type=\"date\"><\/label><label><span>Common End Date<\/span><input id=\"commonEndDate\" type=\"date\"><\/label><\/div><div class=\"table-wrap\">\n        <table id=\"readingsTable\">\n          <thead>\n            <tr>\n              <th>Tenant ID<\/th>\n              <th>Tenant Name<\/th>\n              <th>Unit<\/th>\n              <th>Meter No.<\/th>\n              \n              <th>Start Reading<\/th>\n              \n              <th>End Reading<\/th>\n              <th>Units<\/th>\n              <th>Energy Charge<\/th>\n              <th>Fixed Share<\/th>\n              <th>SSC Levy<\/th>\n              <th>Total Due<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody><\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"summary-cards\">\n        <div class=\"summary-card\">\n          <span>Total Building Units<\/span>\n          <strong id=\"totalUnits\">0<\/strong>\n        <\/div>\n        <div class=\"summary-card\">\n          <span>Total Energy Charges<\/span>\n          <strong id=\"totalEnergy\">Rs. 0.00<\/strong>\n        <\/div>\n        <div class=\"summary-card\">\n          <span>Total Fixed Charges Allocated<\/span>\n          <strong id=\"totalFixed\">Rs. 0.00<\/strong>\n        <\/div>\n        <div class=\"summary-card\">\n          <span>Total SSC Levy<\/span>\n          <strong id=\"totalSsc\">Rs. 0.00<\/strong>\n        <\/div>\n        <div class=\"summary-card\">\n          <span>Total Amount Billed<\/span>\n          <strong id=\"totalBilled\">Rs. 0.00<\/strong>\n        <\/div><div class=\"summary-card\" style=\"display:flex;flex-direction:column;justify-content:center;gap:7px\"><button id=\"confirmReadingsBtn\" type=\"button\">Confirm All Readings<\/button><span id=\"readingsConfirmationStatus\" class=\"help\">Readings not confirmed.<\/span><button id=\"newElectricityPeriodBtn\" type=\"button\" style=\"background:#52677e\">New Billing Period<\/button><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel no-print\">\n      <div class=\"panel-title-row\">\n        <h2>Bill Preview<\/h2>\n        <div class=\"inline-actions\">\n          <label>\n            <span>Select Tenant<\/span>\n            <select id=\"tenantPicker\"><\/select>\n          <\/label>\n          <button id=\"printBtn\" type=\"button\" disabled title=\"Issue and save the bill before printing\">Print / Save PDF<\/button><button id=\"issueCheBtn\" type=\"button\" disabled>Issue Bill<\/button>\n        <\/div>\n      <\/div>\n      <p class=\"help\">Tip: open the bill preview, click Print / Save PDF, then choose “Save as PDF” in your browser.<\/p>\n    <\/section>\n\n    <section id=\"billSheet\" class=\"bill-sheet\">\n      <div class=\"bill-top\">\n        <div>\n          <div class=\"eyebrow\">Electricity Bill<\/div>\n          \n          <div id=\"billRecipient\" class=\"issuer-identity bill-recipient\"><span class=\"issuer-prefix\">Bill to:<\/span><div class=\"issuer-identity-details\"><div id=\"billRecipientName\" class=\"issuer-label\">-<\/div><div id=\"billRecipientAddress\" class=\"issuer-address\"><\/div><\/div><\/div><p id=\"billTenantLine\">-<\/p>\n        <\/div>\n        <div class=\"issue-box\"><div class=\"bill-number-right\"><span>Bill No.<\/span><strong id=\"billNumberRight\">-<\/strong><\/div><div class=\"bill-issuer-right\"><div class=\"issuer-identity\"><span class=\"issuer-prefix\">Issued by:<\/span><div class=\"issuer-identity-details\"><div id=\"billIssuer\" class=\"issuer-label\">Property owner not assigned<\/div><div id=\"billIssuerAddress\" class=\"issuer-address\"><\/div><\/div><\/div><\/div>\n          <div><span>Issue Date<\/span><strong id=\"billIssueDate\">-<\/strong><\/div>\n          <div><span>Due Date<\/span><strong id=\"billDueDate\">-<\/strong><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"mini-grid\">\n        <div class=\"mini-card\">\n          <span>Start Date<\/span>\n          <strong id=\"billStartDate\">-<\/strong>\n        <\/div>\n        <div class=\"mini-card\">\n          <span>End Date<\/span>\n          <strong id=\"billEndDate\">-<\/strong>\n        <\/div>\n        <div class=\"mini-card\">\n          <span>Meter No.<\/span>\n          <strong id=\"billMeterNo\">-<\/strong>\n        <\/div>\n      <\/div>\n\n      <div class=\"charge-banner\">\n        <div class=\"chip\">\n          <span>Current Reading<\/span>\n          <strong id=\"billEndReading\">0<\/strong>\n        <\/div>\n        <div class=\"operator\">-<\/div>\n        <div class=\"chip\">\n          <span>Previous Reading<\/span>\n          <strong id=\"billStartReading\">0<\/strong>\n        <\/div>        \n        <div class=\"operator\">=<\/div>\n        <div class=\"chip emphasis\">\n          <span>Consumed Units<\/span>\n          <strong id=\"billUnits\">0<\/strong>\n        <\/div>\n      <\/div>\n\n      <div class=\"bill-grid\">\n        <div class=\"bill-panel\">\n          <h3>Charge Breakdown<\/h3>\n          <table class=\"charge-table\">\n            <tbody>\n              <tr><td>Unit Price<\/td><td id=\"billUnitPrice\">Rs. 0.00<\/td><\/tr>\n              <tr><td>Energy Charge<\/td><td id=\"billEnergy\">Rs. 0.00<\/td><\/tr>\n              <tr><td>Tenant Fixed Share<\/td><td id=\"billFixedShare\">Rs. 0.00<\/td><\/tr>\n              <tr><td>SSC Levy<\/td><td id=\"billSsc\">Rs. 0.00<\/td><\/tr>\n              <tr class=\"total-row\"><td>Total Due<\/td><td id=\"billTotal\">Rs. 0.00<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"bill-panel\">\n          <h3>Calculation<\/h3>\n          <div class=\"formula-box\">\n            <p id=\"formulaEnergy\">Energy = Units × Price<\/p>\n            <p id=\"formulaFixed\">Fixed = Total Fixed Charge × (Tenant Units / Total Units)<\/p>\n            <p id=\"formulaSsc\">SSC Levy Share = Total SSC Levy × (Tenant Units / Total Units)<\/p>\n          <\/div>\n          <div class=\"notes-box\">\n            <h4>Notes<\/h4>\n            <p id=\"billNotesPreview\">-<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <template id=\"rowTemplate\">\n    <tr>\n      <td><input data-field=\"tenantId\" type=\"text\" /><\/td>\n      <td><input data-field=\"tenantName\" type=\"text\" /><\/td>\n      <td><input data-field=\"unit\" type=\"text\" /><\/td>\n      <td><input data-field=\"meterNo\" type=\"text\" /><\/td>\n      \n      <td><input data-field=\"startReading\" type=\"number\" min=\"0\" step=\"1\" /><\/td>\n      \n      <td><input data-field=\"endReading\" type=\"number\" min=\"0\" step=\"1\" /><\/td>\n      <td class=\"calc\" data-field=\"units\">0<\/td>\n      <td class=\"calc\" data-field=\"energyCharge\">Rs. 0.00<\/td>\n      <td class=\"calc\" data-field=\"fixedShare\">Rs. 0.00<\/td>\n      <td class=\"calc\" data-field=\"sscLevy\">Rs. 0.00<\/td>\n      <td class=\"calc\" data-field=\"totalDue\">Rs. 0.00<\/td>\n      \n    <\/tr>\n  <\/template>\n\n  <script>\nfunction cheEmbeddedConfirm(message){return new Promise(resolve=>{const layer=document.getElementById('che-electric-modal');document.getElementById('che-electric-modal-message').textContent=String(message);layer.classList.add('visible');const ok=document.getElementById('che-electric-modal-accept'),cancel=document.getElementById('che-electric-modal-cancel');const done=v=>{layer.classList.remove('visible');ok.onclick=null;cancel.onclick=null;resolve(v)};ok.onclick=()=>done(true);cancel.onclick=()=>done(false);ok.focus()})}\nfunction cheEmbeddedNotice(msg){window.parent.postMessage({type:'che-ui-notice',message:String(msg)},'*')}\nconst STORAGE_KEY = 'che-electricity-module-v1';\nconst API_BASE = 'api';\n\nconst state = {\n  settings: {\n    propertyName: '',\n    unitPrice: 34,\n    fixedCharge: 1600,\n    sscAmount: 1979.03,\n    dueDays: 14,\n    billNotes: 'Please pay within the due period. Share proof of payment after transfer.'\n  },\n  rows: [],\n  selectedTenantId: '',\n  periodStart:'',periodEnd:'',confirmedSnapshot:null,previousEndReadings:{}\n};\n\nconst els = {\n  propertyName: document.getElementById('propertyName'),\n  unitPrice: document.getElementById('unitPrice'),\n  fixedCharge: document.getElementById('fixedCharge'),\n  sscAmount: document.getElementById('sscRate'),\n  dueDays: document.getElementById('dueDays'),\n  billNotes: document.getElementById('billNotes'),\n  tbody: document.querySelector('#readingsTable tbody'),\n  tenantPicker: document.getElementById('tenantPicker'),\n  totalUnits: document.getElementById('totalUnits'),\n  totalEnergy: document.getElementById('totalEnergy'),\n  totalFixed: document.getElementById('totalFixed'),\n  totalSsc: document.getElementById('totalSsc'),\n  totalBilled: document.getElementById('totalBilled'),\n  billProperty: document.getElementById('billProperty'),\n  billTenantLine: document.getElementById('billTenantLine'),\n  billIssueDate: document.getElementById('billIssueDate'),\n  billDueDate: document.getElementById('billDueDate'),\n  billStartDate: document.getElementById('billStartDate'),\n  billEndDate: document.getElementById('billEndDate'),\n  billMeterNo: document.getElementById('billMeterNo'),\n  billStartReading: document.getElementById('billStartReading'),\n  billEndReading: document.getElementById('billEndReading'),\n  billUnits: document.getElementById('billUnits'),\n  billUnitPrice: document.getElementById('billUnitPrice'),\n  billEnergy: document.getElementById('billEnergy'),\n  billFixedShare: document.getElementById('billFixedShare'),\n  billSsc: document.getElementById('billSsc'),\n  billTotal: document.getElementById('billTotal'),\n  formulaEnergy: document.getElementById('formulaEnergy'),\n  formulaFixed: document.getElementById('formulaFixed'),\n  formulaSsc: document.getElementById('formulaSsc'),\n  billNotesPreview: document.getElementById('billNotesPreview'),\n  saveStatus: document.getElementById('saveStatus')\n};\n\nfunction currency(value) {\n  return `Rs. ${Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;\n}\n\nfunction number(value) {\n  return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });\n}\n\nfunction formatDate(dateStr) {\n  if (!dateStr) return '-';\n  const d = new Date(dateStr);\n  if (Number.isNaN(d.getTime())) return '-';\n  return d.toISOString().slice(0, 10);\n}\n\nfunction addDays(dateStr, days) {\n  if (!dateStr) return '';\n  const d = new Date(dateStr);\n  if (Number.isNaN(d.getTime())) return '';\n  d.setDate(d.getDate() + Number(days || 0));\n  return d.toISOString().slice(0, 10);\n}\n\nfunction getComputedRows() {\n  const totalUnits = state.rows.reduce((sum, row) => sum + Math.max(0, Number(row.endReading || 0) - Number(row.startReading || 0)), 0);\n\n  return state.rows.map((row) => {\n    const units = Math.max(0, Number(row.endReading || 0) - Number(row.startReading || 0));\n    const energyCharge = units * Number(state.settings.unitPrice || 0);\n    const fixedShare = totalUnits > 0 ? Number(state.settings.fixedCharge || 0) * (units / totalUnits) : 0;\n    const sscLevy = totalUnits > 0 ? Number(state.settings.sscAmount || 0) * (units / totalUnits) : 0;\n    const totalDue = energyCharge + fixedShare + sscLevy;\n    return { ...row, startDate:state.periodStart, endDate:state.periodEnd, units, energyCharge, fixedShare, sscLevy, totalDue, totalUnits };\n  });\n}\n\nfunction syncSettingsFromInputs() {\n  state.settings.propertyName = els.propertyName.value.trim();\n  state.settings.unitPrice = Number(els.unitPrice.value || 0);\n  state.settings.fixedCharge = Number(els.fixedCharge.value || 0);\n  state.settings.sscAmount = Number(els.sscAmount.value || 0);\n  state.settings.dueDays = Number(els.dueDays.value || 0);\n  state.settings.billNotes = els.billNotes.value.trim();\n}\n\nfunction renderSettings() {\n  els.propertyName.value = state.settings.propertyName;\n  els.unitPrice.value = state.settings.unitPrice;\n  els.fixedCharge.value = state.settings.fixedCharge;\n  els.sscAmount.value = state.settings.sscAmount;\n  els.dueDays.value = state.settings.dueDays;\n  els.billNotes.value = state.settings.billNotes;\n}\n\nfunction createEmptyRow() {\n  return {\n    tenantId: '',\n    tenantName: '',\n    unit: '',\n    meterNo: '',\n    startDate: '',\n    startReading: '',\n    endDate: '',\n    endReading: ''\n  };\n}\n\nfunction updateRowComputedDisplays() {\n  const computedRows = getComputedRows();\n  Array.from(els.tbody.querySelectorAll('tr')).forEach((tr, index) => {\n    const row = computedRows[index];\n    if (!row) return;\n    tr.querySelector('[data-field=\"units\"]').textContent = number(row.units);\n    tr.querySelector('[data-field=\"energyCharge\"]').textContent = currency(row.energyCharge);\n    tr.querySelector('[data-field=\"fixedShare\"]').textContent = currency(row.fixedShare);\n    tr.querySelector('[data-field=\"sscLevy\"]').textContent = currency(row.sscLevy);\n    tr.querySelector('[data-field=\"totalDue\"]').textContent = currency(row.totalDue);\n  });\n}\n\nfunction renderTable() {\n  els.tbody.innerHTML = '';\n  document.getElementById('commonStartDate').value=state.periodStart||'';\n  document.getElementById('commonEndDate').value=state.periodEnd||'';\n\n  // Tenant rows are supplied by the CHE Holdings tenant directory.\n\n  const computedRows = getComputedRows();\n  computedRows.forEach((row, index) => {\n    const tpl = document.getElementById('rowTemplate').content.cloneNode(true);\n    const tr = tpl.querySelector('tr');\n\n    tr.querySelectorAll('input[data-field]').forEach((input) => {\n      const field = input.dataset.field;\n      input.value = row[field] ?? '';\n      if (['tenantId','tenantName','unit'].includes(field)) { input.readOnly=true; input.tabIndex=-1; input.title='Managed in CHE Holdings tenant/unit profiles'; }\n      input.addEventListener('input', (e) => {\n        if (['tenantId','tenantName','unit'].includes(field)) return;\n        state.rows[index][field] = e.target.value;\n        invalidateConfirmation();\n        syncSettingsFromInputs();\n        updateRowComputedDisplays();\n        renderSummary();\n        renderPicker();\n        renderBill();\n      });\n    });\n\n    tr.querySelector('[data-field=\"units\"]').textContent = number(row.units);\n    tr.querySelector('[data-field=\"energyCharge\"]').textContent = currency(row.energyCharge);\n    tr.querySelector('[data-field=\"fixedShare\"]').textContent = currency(row.fixedShare);\n    tr.querySelector('[data-field=\"sscLevy\"]').textContent = currency(row.sscLevy);\n    tr.querySelector('[data-field=\"totalDue\"]').textContent = currency(row.totalDue);\n\n    els.tbody.appendChild(tr);\n  });\n}\n\nfunction renderSummary() {\n  const computedRows = getComputedRows();\n  const totalUnits = computedRows.reduce((sum, row) => sum + row.units, 0);\n  const totalEnergy = computedRows.reduce((sum, row) => sum + row.energyCharge, 0);\n  const totalFixed = computedRows.reduce((sum, row) => sum + row.fixedShare, 0);\n  const totalSsc = computedRows.reduce((sum, row) => sum + row.sscLevy, 0);\n  const totalBilled = computedRows.reduce((sum, row) => sum + row.totalDue, 0);\n\n  els.totalUnits.textContent = number(totalUnits);\n  els.totalEnergy.textContent = currency(totalEnergy);\n  els.totalFixed.textContent = currency(totalFixed);\n  els.totalSsc.textContent = currency(totalSsc);\n  els.totalBilled.textContent = currency(totalBilled);\n}\n\nfunction renderPicker() {\n  const computedRows = getComputedRows();\n  const validRows = computedRows.filter(r => r.tenantId || r.tenantName);\n\n  if (!state.selectedTenantId && validRows[0]) {\n    state.selectedTenantId = validRows[0].tenantId;\n  }\n  if (state.selectedTenantId && !validRows.find(r => r.tenantId === state.selectedTenantId)) {\n    state.selectedTenantId = validRows[0]?.tenantId || '';\n  }\n\n  const currentOptions = Array.from(els.tenantPicker.options).map(opt => ({ value: opt.value, text: opt.textContent }));\n  const nextOptions = validRows.map(row => ({\n    value: row.tenantId,\n    text: `${row.tenantId || '(No ID)'} - ${row.tenantName || 'Unnamed tenant'}`\n  }));\n\n  if (!nextOptions.length) {\n    nextOptions.push({ value: '', text: 'No tenant rows yet' });\n  }\n\n  const sameOptions = currentOptions.length === nextOptions.length\n    && currentOptions.every((opt, idx) => opt.value === nextOptions[idx].value && opt.text === nextOptions[idx].text);\n\n  if (!sameOptions) {\n    els.tenantPicker.innerHTML = '';\n    nextOptions.forEach((item) => {\n      const opt = document.createElement('option');\n      opt.value = item.value;\n      opt.textContent = item.text;\n      els.tenantPicker.appendChild(opt);\n    });\n  }\n\n  els.tenantPicker.value = state.selectedTenantId || nextOptions[0]?.value || '';\n}\n\nfunction renderBill() {\n  const computedRows = getComputedRows();\n  const row = computedRows.find(r => r.tenantId === state.selectedTenantId) || computedRows[0];\n  const today = new Date().toLocaleDateString('en-CA');\n\n  els.billProperty.textContent = state.settings.propertyName || '-';\n  if (!row) {\n    document.getElementById('billNumberRight').textContent='PREVIEW';\n    els.billTenantLine.textContent = 'Add tenant readings to preview a bill.';\n    return;\n  }\n\n  document.getElementById('billNumberRight').textContent='PREVIEW';\n  els.billTenantLine.textContent = ''; \n  els.billIssueDate.textContent = today;\n  els.billDueDate.textContent = formatDate(addDays(today, Number(state.settings.dueDays || 0)));\n  els.billStartDate.textContent = formatDate(row.startDate);\n  els.billEndDate.textContent = formatDate(row.endDate);\n  els.billMeterNo.textContent = row.meterNo || '-';\n  els.billStartReading.textContent = number(row.startReading);\n  els.billEndReading.textContent = number(row.endReading);\n  els.billUnits.textContent = number(row.units);\n  els.billUnitPrice.textContent = currency(state.settings.unitPrice);\n  els.billEnergy.textContent = currency(row.energyCharge);\n  els.billFixedShare.textContent = currency(row.fixedShare);\n  els.billSsc.textContent = currency(row.sscLevy);\n  els.billTotal.textContent = currency(row.totalDue);\n  els.formulaEnergy.textContent = `Energy Charge = ${number(row.units)} × ${currency(state.settings.unitPrice)} = ${currency(row.energyCharge)}`;\n  els.formulaFixed.textContent = `Fixed Share = ${currency(state.settings.fixedCharge)} × (${number(row.units)} / ${number(row.totalUnits)}) = ${currency(row.fixedShare)}`;\n  els.formulaSsc.textContent = `SSC Levy Share = ${currency(state.settings.sscAmount)} × (${number(row.units)} / ${number(row.totalUnits)}) = ${currency(row.sscLevy)}`;\n  els.billNotesPreview.textContent = state.settings.billNotes || '-';\n  updateIssuedState();\n}\n\nfunction refresh() {\n  syncSettingsFromInputs();\n  renderTable();\n  renderSummary();\n  renderPicker();\n  renderBill();\n  updateIssuedState();\n}\n\nfunction setSaveStatus(message, isError = false) {\n  if (!els.saveStatus) return;\n  els.saveStatus.textContent = message || '';\n  els.saveStatus.style.color = isError ? '#b91c1c' : '#166534';\n}\n\nasync function saveToServer() {\n  syncSettingsFromInputs();\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n  window.parent.postMessage({type:'che-electricity-save',payload:state},'*');\n  setSaveStatus('Saved in CHE Holdings browser data.');\n}\nasync function loadFromServer() {return false;}\nfunction loadFromBrowser() {\n  const raw = localStorage.getItem(STORAGE_KEY);\n  if (!raw) return false;\n  try {\n    const saved = JSON.parse(raw);\n    Object.assign(state.settings, saved.settings || {});\n    state.rows = Array.isArray(saved.rows) ? saved.rows : [];\n    state.selectedTenantId = saved.selectedTenantId || '';\n    state.periodStart=saved.periodStart||'';state.periodEnd=saved.periodEnd||'';state.confirmedSnapshot=saved.confirmedSnapshot||null;state.previousEndReadings=saved.previousEndReadings||{};\n    return true;\n  } catch (err) {\n    console.error(err);\n    return false;\n  }\n}\n\nfunction loadSampleData() {\n  state.settings = {\n    propertyName: '',\n    unitPrice: 34,\n    fixedCharge: 1600,\n    sscAmount: 1979.03,\n    dueDays: 14,\n    billNotes: 'Please pay within the due period. Share proof of payment after transfer.'\n  };\n  state.rows = [\n    { tenantId: 'T001', tenantName: 'Ground Floor Shop', unit: 'GF-01', meterNo: 'MTR-001', startDate: '2026-02-19', startReading: 209822, endDate: '2026-03-20', endReading: 212045 },\n    { tenantId: 'T002', tenantName: 'First Floor Office', unit: 'FF-02', meterNo: 'MTR-002', startDate: '2026-02-19', startReading: 87650, endDate: '2026-03-20', endReading: 89100 },\n    { tenantId: 'T003', tenantName: 'Rear Office', unit: 'RO-03', meterNo: 'MTR-003', startDate: '2026-02-19', startReading: 43120, endDate: '2026-03-20', endReading: 44100 }\n  ];\n  state.selectedTenantId = 'T001';\n  renderSettings();\n  refresh();\n}\n\nfunction exportCsv() {\n  const rows = getComputedRows();\n  const header = ['Tenant ID','Tenant Name','Unit','Meter No.','Start Date','Start Reading','End Date','End Reading','Units','Energy Charge','Fixed Share','SSC Levy','Total Due'];\n  const lines = [header.join(',')];\n  rows.forEach((row) => {\n    lines.push([\n      row.tenantId,\n      row.tenantName,\n      row.unit,\n      row.meterNo,\n      row.startDate,\n      row.startReading,\n      row.endDate,\n      row.endReading,\n      row.units,\n      row.energyCharge.toFixed(2),\n      row.fixedShare.toFixed(2),\n      row.sscLevy.toFixed(2),\n      row.totalDue.toFixed(2)\n    ].map((value) => `\"${String(value ?? '').replaceAll('\"','\"\"')}\"`).join(','));\n  });\n  const blob = new Blob([lines.join('\\n')], { type: 'text/csv;charset=utf-8;' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'tenant-electricity-b (settings.unitPrice),Number(settings.fixedCharge),Number(settings.sscAmount),Number(row.totalUnits),Number(settings.dueDays),settings.billNotes||'',settings.propertyName||'']);}\nfunction isCurrentBillIssued(){const row=getComputedRows().find(r=>String(r.tenantId)===String(state.selectedTenantId));return !!row&&issuedBills.some(i=>i.signature===billSignature(row,state.settings));}\nfunction updateIssuedState(){const issued=isCurrentBillIssued(),confirmed=isConfirmed();const print=document.getElementById('printBtn'),issue=document.getElementById('issueCheBtn'),confirm=document.getElementById('confirmReadingsBtn'),status=document.getElementById('readingsConfirmationStatus');if(!print)return;print.disabled=!issued;print.title=issued?'Print issued bill':'Issue this bill before printing';issue.disabled=!confirmed||issued;issue.textContent=issued?'Bill Issued':'Issue Bill';confirm.disabled=confirmed;status.textContent=confirmed?'All readings confirmed and saved. Select a tenant to issue its bill.':'Unconfirmed changes. Confirm all readings before issuing bills.';}\nfunction validateAllReadings(){if(!state.periodStart||!state.periodEnd||state.periodStart>state.periodEnd)return 'Enter valid common start and end dates.';if(!state.rows.length)return 'No active tenant rows available.';for(const r of state.rows){if(!r.meterNo||r.startReading===''||r.endReading==='')return 'Enter meter number and both readings for every tenant ('+r.tenantName+').';if(!Number.isFinite(Number(r.startReading))||!Number.isFinite(Number(r.endReading))||Number(r.startReading)<0||Number(r.endReading)<Number(r.startReading))return 'Invalid readings for '+r.tenantName;}return '';}\ndocument.getElementById('commonStartDate').addEventListener('input',e=>{state.periodStart=e.target.value;invalidateConfirmation();renderBill()});\ndocument.getElementById('commonEndDate').addEventListener('input',e=>{state.periodEnd=e.target.value;invalidateConfirmation();renderBill()});\nasync function newElectricityPeriod(){\n if(!isConfirmed())return cheEmbeddedNotice('Confirm current readings before starting the next billing period.');\n if(!await cheEmbeddedConfirm('Start the next billing period? Confirmed end readings will become start readings and new end readings will be blank.'))return;\n const oldEnd=state.periodEnd;const next=new Date(oldEnd+'T12:00:00');next.setMonth(next.getMonth()+1);const fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');\n state.previousEndReadings=Object.fromEntries(state.rows.map(r=>[String(r.tenantId),r.endReading]));\n state.periodStart=oldEnd;state.periodEnd=fmt(next);\n state.rows=state.rows.map(r=>({...r,startReading:state.previousEndReadings[String(r.tenantId)]??'',endReading:'',startDate:state.periodStart,endDate:state.periodEnd}));\n state.confirmedSnapshot=null;refresh();saveToServer();\n}\ndocument.getElementById('newElectricityPeriodBtn').addEventListener('click',newElectricityPeriod);\ndocument.getElementById('confirmReadingsBtn').addEventListener('click',async ()=>{const err=validateAllReadings();if(err)return cheEmbeddedNotice(err);if(!await cheEmbeddedConfirm('Confirm and save all tenant readings for '+state.periodStart+' to '+state.periodEnd+'? Any subsequent change will require reconfirmation.'))return;state.confirmedSnapshot=confirmationSnapshot();saveToServer();window.parent.postMessage({type:'che-electricity-confirmed',payload:{periodStart:state.periodStart,periodEnd:state.periodEnd,readings:state.rows.map(r=>({tenantId:r.tenantId,endReading:r.endReading}))}},'*');updateIssuedState();});\nwindow.addEventListener('message',event=>{\n if(event.data?.type==='che-electricity-issued'){issuedBills.push({signature:event.data.signature,number:event.data.number});updateIssuedState();return;}\n if(event.data?.type!=='che-electricity-init')return;\n const payload=event.data.payload||{};\n window.cheTenantIssuers=Object.fromEntries((payload.tenants||[]).map(t=>[String(t.id),t.issuerName]));window.cheTenantIssuerAddresses=Object.fromEntries((payload.tenants||[]).map(t=>[String(t.id),t.issuerAddress||'']));window.cheTenantRecipientNames=Object.fromEntries((payload.tenants||[]).map(t=>[String(t.id),t.billingName||t.name||'']));window.cheTenantRecipientAddresses=Object.fromEntries((payload.tenants||[]).map(t=>[String(t.id),t.address||'']));issuedBills=payload.issuedBills||[];\n if(payload.saved?.settings)Object.assign(state.settings,payload.saved.settings);\n const savedRows=payload.saved?.rows||state.rows,existing=new Map(savedRows.map(r=>[String(r.tenantId),r]));\n const defaults=periodDefaults();state.periodStart=payload.saved?.periodStart||defaults.start;state.periodEnd=payload.saved?.periodEnd||defaults.end;\n state.previousEndReadings=payload.saved?.previousEndReadings||{};\n state.rows=(payload.tenants||[]).map(t=>{const prev=existing.get(String(t.id))||{};const last=state.previousEndReadings[String(t.id)];const isNewCycle=!!payload.saved?.periodEnd&&payload.saved.periodEnd!==state.periodEnd;return {...createEmptyRow(),...prev,tenantId:t.id,tenantName:t.name,unit:t.unit,startDate:state.periodStart,endDate:state.periodEnd,startReading:isNewCycle?(last??prev.endReading??''):(prev.startReading??last??''),endReading:isNewCycle?'':(prev.endReading??'')};});\n state.confirmedSnapshot=payload.saved?.confirmedSnapshot||null;\n if(state.confirmedSnapshot&&state.periodEnd<defaults.end){\n   const ends=Object.fromEntries(state.rows.map(r=>[String(r.tenantId),r.endReading]));\n   state.previousEndReadings=ends;state.periodStart=defaults.start;state.periodEnd=defaults.end;\n   state.rows=state.rows.map(r=>({...r,startDate:state.periodStart,endDate:state.periodEnd,startReading:ends[String(r.tenantId)]??'',endReading:''}));state.confirmedSnapshot=null;\n }\n if(payload.tenantId)state.selectedTenantId=payload.tenantId;\n if(!state.rows.some(r=>String(r.tenantId)===String(state.selectedTenantId)))state.selectedTenantId=state.rows[0]?.tenantId||'';\n renderSettings();refresh();saveToServer();\n});\nfunction syncCheIssuer(){const target=document.getElementById('billIssuer');if(!target)return;const selected=String(state.selectedTenantId||'');target.textContent=window.cheTenantIssuers?.[selected]||'Property owner not assigned';let addr=document.getElementById('billIssuerAddress');if(!addr){addr=document.createElement('div');addr.id='billIssuerAddress';addr.className='issuer-address';target.insertAdjacentElement('afterend',addr);addr.style.cssText='margin:2px 0 0;padding:0;line-height:1.45;font-size:12px;color:#617085;white-space:pre-line;text-align:left'}addr.textContent=window.cheTenantIssuerAddresses?.[selected]||'';const recipient=document.getElementById('billRecipientName'),recipientAddress=document.getElementById('billRecipientAddress');if(recipient)recipient.textContent=window.cheTenantRecipientNames?.[selected]||'-';if(recipientAddress)recipientAddress.textContent=window.cheTenantRecipientAddresses?.[selected]||'';}\nconst cheIssuerObserver=new MutationObserver(()=>syncCheIssuer());\nconst cheTenantLine=document.getElementById('billTenantLine');if(cheTenantLine)cheIssuerObserver.observe(cheTenantLine,{childList:true,subtree:true,characterData:true});\ndocument.getElementById('issueCheBtn').addEventListener('click',async ()=>{\n if(!isConfirmed())return cheEmbeddedNotice('Confirm all readings first.');\n const row=getComputedRows().find(r=>String(r.tenantId)===String(state.selectedTenantId));\n if(!row)return cheEmbeddedNotice('Select a tenant.');\n if(isCurrentBillIssued())return cheEmbeddedNotice('This bill has already been issued. You can print it.');\n if(!await cheEmbeddedConfirm('Issue the electricity bill for '+row.tenantName+'?'))return;\n window.parent.postMessage({type:'che-electricity-issue',row,settings:{...state.settings},signature:billSignature(row,state.settings)},'*');\n});\n<\/script>\n<script>window.addEventListener('message',function(e){if(e.data?.type!=='che-theme')return;const p={navy:['#17253a','#2 function openBilling(id=''){utilityReturnTenantId=id;utilityDraft=null;selected='';page='billing';render()}
function billingBack(){if(utilityReturnTenantId){selected=utilityReturnTenantId;page='tenants';section='Billing & Invoices';render()}else go('billing')}
function billingModuleCards(){return `<div class="grid"><div class="module-card"><h3>⚡ Electricity</h3><p>Multi-tenant meter readings, proportional fixed charges and SSC allocation.</p><button onclick="openElectricityIntegrated()">Open Electricity Billing</button></div><div class="module-card"><h3>💧 Water</h3><p>Shared tanks, individual tenant meters and proportional allocation of actual tank charges.</p><button onclick="openWaterIntegrated()">Open Water Billing</button></div></div>`}
function billingPage(){const t=db.tenants.find(x=>x.id===utilityReturnTenantId);$('app').innerHTML=`<section class="panel"><div class="toolbar"><h2>New Bill · Billing Modules</h2><button class="alt" onclick="${t?'billingBack()':"openFinance('billing','new')"}">← Back</button></div>${t?`<p>Tenant: <b>${esc(t.name)}</b></p>`:''}${billingModuleCards()}</section>`}
function startUtility(type){const t=db.tenants.find(x=>x.id===utilityReturnTenantId)||db.tenants.find(x=>x.status==='Active');utilityDraft={type,tenantId:t?.id||'',date:new Date().toLocaleDateString('en-CA'),periodStart:'',periodEnd:'',meterNumber:'',previous:'',current:'',rate:'',fixed:'0',adjustment:'0',buildingUnits:'',sscTotal:'0',due:'',propertyAddress:'374, Peradeniya Road, Kandy',notes:'Kindly make the payment on or before the due date.'};page='utilityEditor';render()}
function utilitySet(k,v){utilityDraft[k]=v;if(['previous','current','rate','fixed','adjustment','buildingUnits','sscTotal'].includes(k))utilityCalculate()}
function utilityValues(){const d=utilityDraft,consumption=Number(d.current)-Number(d.previous),usage=Math.round(consumption*Number(d.rate)*100)/100,share=d.type==='electricity'&&Number(d.buildingUnits)>0?consumption/Number(d.buildingUnits):0,fixed=d.type==='electricity'?Math.round(Number(d.fixed)*share*100)/100:Number(d.fixed),ssc=d.type==='electricity'?Math.round(Number(d.sscTotal||0)*share*100)/100:0;return {consumption,usage,fixed,ssc,total:Math.round((usage+fixed+ssc+Number(d.adjustment))*100)/100}}
function utilityCalculate(){const d=utilityDraft,n=utilityValues(),e=$('utilityCalc');if(e)e.innerHTML=d.previous!==''&&d.current!==''&&d.rate!==''&&n.consumption>=0&&Number.isFinite(n.total)?`<b>Consumption:</b> ${n.consumption} ${d.type==='water'?'m³':'kWh'}<br><b>Energy charge:</b> ${money(n.usage)}<br><b>Fixed share:</b> ${money(n.fixed)}<br><b>SSC share:</b> ${money(n.ssc)}<br><b>Total:</b> ${money(n.total)}`:'Enter valid meter readings and a rate to calculate the total.'}
function utilityEditorPage(){const d=utilityDraft;if(!d)return openBilling();const water=d.type==='water',name=water?'Water':'Electricity',units=water?'m³':'kWh';const field=(label,key,type='text')=>`<div><label>${label}</label><input type="${type}" ${type==='number'?'step="any"':''} value="${esc(d[key])}" oninput="utilitySet('${key}',this.value)"></div>`;$('app').innerHTML=`<section class="panel"><div class="toolbar"><h2>${name} Billing</h2><button class="alt" onclick="page='billing';render()">← Billing Modules</button></div><p class="muted">This module uses a configurable flat rate for testing. It does not assume an official utility tariff.</p><div class="grid"><div><label>Tenant</label><select onchange="utilitySet('tenantId',this.value)">${db.tenants.filter(t=>t.status==='Active').map(t=>`<option value="${t.id}" ${d.tenantId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>${field('Bill Date','date','date')}${water?'':field('Due Date','due','date')+field('Property Address','propertyAddress')}${field('Period From','periodStart','date')}${field('Period To','periodEnd','date')}${field('Meter Number','meterNumber')}${field('Previous Reading ('+units+')','previous','number')}${field('Current Reading ('+units+')','current','number')}${field('Rate per '+units+' (LKR)','rate','number')}${field(water?'Fixed Charge (LKR)':'Total Building Fixed Charge (LKR)','fixed','number')}${water?'':field('Total Building Consumption (kWh)','buildingUnits','number')+field('Total Building SSC Levy (LKR)','sscTotal','number')}${field('Adjustment (+/- LKR)','adjustment','number')}</div><label>Notes</label><textarea rows="3" oninput="utilitySet('notes',this.value)">${esc(d.notes)}</textarea><div class="notice" id="utilityCalc"></div><div class="actions"><button onclick="previewUtility()">Preview ${name} Bill</button><button class="alt" onclick="page='billing';render()">Cancel</button></div></section>`;utilityCalculate()}

// Water billing: tank-level charges, independent tenant meter readings, proportional allocation.
let waterTankSelected='',waterPeriodKey='',waterPreviewTenantId='';
const waterRound=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function waterDateToday(){return new Date().toLocaleDateString('en-CA')}
function waterPeriodDefault(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');return `${y}-${m}`}
function waterPeriod(){if(!waterPeriodKey)waterPeriodKey=waterPeriodDefault();if(!db.waterPeriods)db.waterPeriods={};if(!db.waterPeriods[waterPeriodKey])db.waterPeriods[waterPeriodKey]={tanks:{},confirmed:false,issued:[]};return db.waterPeriods[waterPeriodKey]}
function waterTankData(id){const p=waterPeriod();if(!p.tanks[id]){const [y,m]=waterPeriodKey.split('-').map(Number);const f=new Date(y,m-2,8),t=new Date(y,m-1,8),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');p.tanks[id]={charge:'',wasteCharge:'',from:iso(f),to:iso(t),readings:{}}}return p.tanks[id]}
function migrateWaterAssignments(){
 for(const w of db.waterTanks){
  w.tenantIds=Array.isArray(w.tenantIds)?w.tenantIds:[];
  for(const id of w.tenantIds){const t=db.tenants.find(x=>x.id===id);if(t&&!t.waterTankId)t.waterTankId=w.id;}
 }
 for(const t of db.tenants){
  if(!t.waterTankId)t.waterTankId='';
  if(!t.waterMeter){
   for(const key of Object.keys(db.waterPeriods||{}).sort().reverse()){
    const m=db.waterPeriods[key]?.tanks?.[t.waterTankId]?.readings?.[t.id]?.meter;
    if(m){t.waterMeter=m;break;}
   }
  }
 }
 for(const w of db.waterTanks)w.tenantIds=db.tenants.filter(t=>t.waterTankId===w.id).map(t=>t.id);
}
migrateWaterAssignments();
function waterTenantList(tank){return db.tenants.filter(t=>t.waterTankId===tank?.id&&t.status==='Active')}
function waterPrevious(id,tankId){const keys=Object.keys(db.waterPeriods||{}).filter(k=>k<waterPeriodKey).sort().reverse();for(const k of keys){const x=db.waterPeriods[k]?.tanks?.[tankId]?.readings?.[id];if(x?.confirmed&&x.current!==''&&Number.isFinite(Number(x.current)))return String(x.current)}return ''}
function waterReading(tankId,tenantId){const td=waterTankData(tankId),t=db.tenants.find(x=>x.id===tenantId);if(!td.readings[tenantId])td.readings[tenantId]={previous:waterPrevious(tenantId,tankId),current:'',meter:t?.waterMeter||'',adjustment:'0',confirmed:false};return td.readings[tenantId]}
function waterAllocations(tank){
 const td=waterTankData(tank.id),people=waterTenantList(tank);
 const rows=people.map(t=>{const r=waterReading(tank.id,t.id),a=Number(r.previous),b=Number(r.current),valid=r.previous!==''&&r.current!==''&&Number.isFinite(a)&&Number.isFinite(b)&&a>=0&&b>=a;return {t,r,valid,usage:valid?waterRound(b-a):0}});
 const units=rows.reduce((sum,r)=>sum+r.usage,0),charge=Number(td.charge),wasteCharge=Number(td.wasteCharge),fixed=0;
 const ready=rows.length>0&&rows.every(r=>r.valid)&&td.charge!==''&&td.wasteCharge!==''&&Number.isFinite(charge)&&charge>=0&&Number.isFinite(wasteCharge)&&wasteCharge>=0&&Number.isFinite(fixed)&&fixed>=0&&units>0;
 let allocatedWater=0,allocatedWaste=0,allocatedFixed=0;
 rows.forEach((r,i)=>{
  r.share=units?r.usage/units:0;
  const last=i===rows.length-1;
  r.usageCharge=ready?(last?waterRound(charge-allocatedWater):waterRound(charge*r.share)):0;
  r.wasteShare=ready?(last?waterRound(wasteCharge-allocatedWaste):waterRound(wasteCharge*r.share)):0;
  r.fixedShare=0;
  allocatedWater+=r.usageCharge;allocatedWaste+=r.wasteShare;allocatedFixed+=r.fixedShare;
  r.adjustment=0;
  r.total=waterRound(r.usageCharge+r.wasteShare+r.fixedShare+r.adjustment);
 });
 return {rows,units,charge,wasteCharge,fixed,ready};
}

function waterConfirm(){const p=waterPeriod();for(const tank of db.waterTanks){const td=waterTankData(tank.id);if(!waterTenantList(tank).length)continue;const calc=waterAllocations(tank);if(!calc.ready){appNotice('Complete readings and valid tank charges for '+tank.name+'. All assigned tenant readings must be valid and total usage greater than zero.');return}if(!td.from||!td.to||td.from>td.to){appNotice('Set a valid billing date range for '+tank.name);return}}if(!db.waterTanks.some(t=>waterTenantList(t).length)){appNotice('Assign tenants to a tank first.');return}for(const tank of db.waterTanks){for(const t of waterTenantList(tank))waterReading(tank.id,t.id).confirmed=true}p.confirmed=true;save();render()}
function waterNextCycle(){
 const p=waterPeriod();
 if(!p.confirmed){appNotice('Confirm and save all readings before starting the next billing cycle.');return}
 const [year,month]=waterPeriodKey.split('-').map(Number);
 const d=new Date(year,month,1);
 const next=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 if(db.waterPeriods?.[next]&&Object.values(db.waterPeriods[next].tanks||{}).some(t=>Object.keys(t.readings||{}).length)){appNotice('The next billing cycle already has readings.');return}
 const previousKey=waterPeriodKey;
 waterPeriodKey=next;
 const np=waterPeriod();
 for(const tank of db.waterTanks){
   const old=db.waterPeriods[previousKey]?.tanks?.[tank.id];
   const td=waterTankData(tank.id);
   if(old?.to){
     const end=new Date(old.to+'T00:00:00');
     td.from=old.to;
     end.setMonth(end.getMonth()+1);
     td.to=end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
   }
   for(const t of waterTenantList(tank)){
     const last=old?.readings?.[t.id];
     td.readings[t.id]={previous:last?.confirmed?String(last.current):waterPrevious(t.id,tank.id),current:'',meter:t.waterMeter||last?.meter||'',adjustment:'0',confirmed:false};
   }
 }
 np.confirmed=false;np.issued=[];
 save();render();appNotice('Next billing cycle created. Previous confirmed end readings have been carried forward.');
}

   </div>

     <div><small>Current Reading</small><strong>${reading(w.current)}</strong></div>
     <b>−</b>
     <div><small>Previous Reading</small><strong>${reading(w.previous)}</strong></div>
     <b>=</b>

   </div>
   <div class="elec-columns">
     <div class="elec-card"><h3>Charge Breakdown</h3>
       <div class="elec-charge"><span>Water Charges</span><b>${money2(water)}</b></div>
       <div class="elec-charge"><span>Waste Water Charges</span><b>${money2(waste)}</b></div>
       
       
       <div class="elec-total"><span>Total Due</span><b>${money2(total)}</b></div>
     </div>
     <div class="elec-card"><h3>Calculation</h3>
       <div class="elec-formulas">

   </div>
 </div>`;
}

 const td=waterTankData(tankId),calc=waterAllocations(tank),r=calc.rows.find(x=>x.t.id===tenantId);if(!r||!calc.ready||!td.from||!td.to||td.from>td.to)return null;
