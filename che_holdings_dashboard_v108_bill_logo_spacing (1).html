 try{
  const w=img.naturalWidth,h=img.naturalHeight;
  if(!w||!h)return;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
  const d=ctx.getImageData(0,0,w,h),a=d.data;
  const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
  const bg=[0,1,2].map(k=>corners.reduce((v,[x,y])=>v+a[(y*w+x)*4+k],0)/4);
  const heading=img.closest('.che-document-heading');
  const target=heading?.querySelector('h2,.elec-tag')||heading;
  const col=getComputedStyle(target||img).color;
  const m=col.match(/[\\d.]+/g)||[];
  const rgb=m.length>=3?m.slice(0,3).map(Number):[28,47,65];
  const bgOpaque=corners.every(([x,y])=>a[(y*w+x)*4+3]>245);
  for(let i=0;i<a.length;i+=4){
   const distance=Math.max(Math.abs(a[i]-bg[0]),Math.abs(a[i+1]-bg[1]),Math.abs(a[i+2]-bg[2]));
   const alpha=bgOpaque?Math.min(1,Math.max(0,(distance-12)/90)):1;
   a[i]=rgb[0];a[i+1]=rgb[1];a[i+2]=rgb[2];a[i+3]=Math.round(a[i+3]*alpha);
  }
  ctx.putImageData(d,0,0);
  // Crop transparent padding so the visible logo begins at the exact content left edge.
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(a[(y*w+x)*4+3]>20){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
  }
  let result=c;
  if(maxX>=minX&&maxY>=minY){
    result=document.createElement('canvas');result.width=maxX-minX+1;result.height=maxY-minY+1;
    result.getContext('2d').drawImage(c,minX,minY,result.width,result.height,0,0,result.width,result.height);
  }
  img.dataset.cheTinted='1';img.src=result.toDataURL('image/png');
 }catch(e){console.warn('Document logo could not be recolored',e)}
}
function issuerBlock(i){const a=issuerAddressOfRecord(i);return '<div class="issuer-identity"><span class="issuer-prefix">Issued by:</span><div class="issuer-identity-details"><div class="issuer-label">'+esc(issuerOfRecord(i))+'</div>'+(a?'<div class="issuer-address">'+esc(a)+'</div>':'')+'</div></div>' }

function billRecipientBlock(i){const t=db.tenants.find(x=>x.id===i.tenantId);const name=i.billTo?.name||t?.billingName||t?.name||'';const address=i.billTo?.address||t?.address||'';return '<div class="issuer-identity bill-recipient"><span class="issuer-prefix">Bill to:</span><div class="issuer-identity-details"><div class="issuer-label">'+esc(name)+'</div>'+(address?'<div class="issuer-address">'+esc(address)+'</div>':'')+'</div></div>'}
function electricityBillMarkup(i){const d=i.utility||{},units=Number(d.consumption??(Number(d.current)-Number(d.previous))),rate=Number(d.rate||0),usage=d.energy!=null?Number(d.energy):Math.round(units*rate*100)/100,building=Number(d.buildingUnits||0),share=building>0?units/building:0,fixed=d.fixedShare!=null?Number(d.fixedShare):Math.round(Number(d.fixed||0)*share*100)/100,ssc=d.ssc!=null?Number(d.ssc):Math.round(Number(d.sscTotal||0)*share*100)/100,adjustment=Number(d.adjustment||0),total=Number(i.total),old=!building;const money2=x=>'Rs. '+Number(x||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});return `<div class="electricity-sheet"><div class="elec-top"><div><div class="che-document-heading">${cheDocumentLogo()}<span class="elec-tag">Electricity Bill</span></div>${billRecipientBlock(i)}</div><div class="elec-dates"><div class="bill-number-right"><span>Bill No.</span><b>${esc(i.number||'—')}</b></div><div class="bill-issuer-right">${issuerBlock(i)}</div><div><span>Issue Date</span><b>${esc(i.date||'')}</b></div><div><span>Due Date</span><b>${esc(i.due||'—')}</b></div></div></div><div class="elec-three"><div><small>Start Date</small><b>${esc(d.periodStart||'—')}</b></div><div><small>End Date</small><b>${esc(d.periodEnd||'—')}</b></div><div><small>Meter No.</small><b>${esc(d.meterNumber||'—')}</b></div></div><div class="elec-equation"><div><small>Current Reading</small><strong>${esc(d.current??'')}</strong></div><b>−</b><div><small>Previous Reading</small><strong>${esc(d.previous??'')}</strong></div><b>=</b><div><small>Consumed Units (kWh)</small><strong>${units}</strong></div></div><div class="elec-columns"><div class="elec-card"><h3>Charge Breakdown</h3><div class="elec-charge"><span>Unit Price</span><b>${money2(rate)}</b></div><div class="elec-charge"><span>Energy Charge</span><b>${money2(usage)}</b></div><div class="elec-charge"><span>Tenant Fixed Share</span><b>${money2(old?Number(d.fixed||0):fixed)}</b></div><div class="elec-charge"><span>SSC Levy</span><b>${money2(ssc)}</b></div>${adjustment?`<div class="elec-charge"><span>Adjustment</span><b>${money2(adjustment)}</b></div>`:''}<div class="elec-total"><span>Total Due</span><b>${money2(old?Number(i.total):total)}</b></div></div><div class="elec-card"><h3>Calculation</h3><div class="elec-formulas"><div>Energy Charge = ${units} × ${money2(rate)} = ${money2(usage)}</div>${old?'<div>Legacy bill: building-wide allocation inputs unavailable.</div>':`<div>Fixed Share = ${money2(d.fixed)} × (${units} / ${building}) = ${money2(fixed)}</div><div>SSC Levy Share = ${money2(d.sscTotal)} × (${units} / ${building}) = ${money2(ssc)}</div>`}</div><h3>Notes</h3><div class="elec-notes">${esc(i.notes||'Kindly make the payment on or before the due date.')}</div></div></div></div>`} 
function invoiceIsCancelled(i){return i.status==='Cancelled'}
function invoiceAuditMarkup(i){const entries=Array.isArray(i.auditTrail)?i.auditTrail:[];return `<div class="no-print" style="margin-top:20px;border-top:1px solid #ddd;padding-top:14px"><h3>Change History</h3>${entries.length?`<table class="table"><thead><tr><th>When</th><th>Action</th><th>Details</th></tr></thead><tbody>${entries.map(a=>`<tr><td>${esc(a.at||'')}</td><td>${esc(a.action||'')}</td><td>${esc(a.details||'')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">No corrections recorded.</p>'}${i.replacesInvoice?`<p>Replacement for <b>${esc(i.replacesInvoice)}</b></p>`:''}${i.replacedBy?`<p>Replaced by <b>${esc(i.replacedBy)}</b></p>`:''}</div>`}
function invoiceActions(i){return `<button class="alt" onclick="editIssuedDetails()" ${invoiceIsCancelled(i)?'disabled':''}>Edit Details</button><button class="alt" onclick="cancelIssuedInvoice()" ${invoiceIsCancelled(i)?'disabled':''}>Cancel Invoice</button>`}
function editIssuedDetails(){const i=db.invoices.find(x=>x.id===selected);if(!i||invoiceIsCancelled(i))return;page='editIssuedDetails';render()}
function editIssuedDetailsPage(){const i=db.invoices.find(x=>x.id===selected);if(!i||invoiceIsCancelled(i)){page='viewInvoice';return render()}$('app').innerHTML=`<section class="panel"><div class="toolbar"><h2>Edit Issued Invoice Details · ${esc(i.number)}</h2><button class="alt" onclick="page='viewInvoice';render()">← Cancel</button></div><p class="muted">Administrative corrections only. Invoice number, tenant, line items and amounts remain locked. Every change is recorded.</p><form id="issuedDetailsForm" onsubmit="saveIssuedDetails(event)"><div class="grid"><div><label>Invoice Date</label><input name="date" type="date" required value="${esc(i.date||'')}"></div><div><label>Due Date</label><input name="due" type="date" value="${esc(i.due||'')}"></div></div><label>Notes</label><textarea name="notes" rows="4">${esc(i.notes||'')}</textarea><label>Payment Instructions</label><textarea name="instructions" rows="3">${esc(i.paymentTo?.instructions||'')}</textarea><label>Reason for Correction (required)</label><textarea name="reason" rows="2" required placeholder="Explain why this correction is needed"></textarea><div class="actions"><button type="submit">Save Correction</button><button type="button" class="alt" onclick="page='viewInvoice';render()">Cancel</button></div></form></section>`}
function saveIssuedDetails(event){event.preventDefault();const i=db.invoices.find(x=>x.id===selected);if(!i||invoiceIsCancelled(i))return;const f=new FormData(event.target),reason=String(f.get('reason')||'').trim(),changes=[];if(!reason)return appNotice('A correction reason is required.');const nextDate=String(f.get('date')||''),nextDue=String(f.get('due')||'');if(!nextDate||nextDue&&nextDue<nextDate)return appNotice('Enter valid dates; due date cannot precede invoice date.');for(const [key,value] of [['date',nextDate],['due',nextDue],['notes',String(f.get('notes')||'')]]){const old=String(i[key]||'');if(old!==value){changes.push(`${key}: ${old||'(blank)'} → ${value||'(blank)'}`);i[key]=value}}i.paymentTo=i.paymentTo||{};const instructions=String(f.get('instructions')||'');if(String(i.paymentTo.instructions||'')!==instructions){changes.push('Payment instructions updated');i.paymentTo.instructions=instructions}if(!changes.length)return appNotice('No changes to save.');i.auditTrail=Array.isArray(i.auditTrail)?i.auditTrail:[];i.auditTrail.push({at:new Date().toISOString(),action:'Administrative correction',details:changes.join('; ')+' | Reason: '+reason});save();page='viewInvoice';render()}
async function cancelIssuedInvoice(){const i=db.invoices.find(x=>x.id===selected);if(!i||invoiceIsCancelled(i))return;const reason=await appPrompt('Reason for cancelling invoice '+i.number+':');if(reason===null)return;if(!reason.trim())return appNotice('Cancellation reason is required.');if(!await appConfirm('Cancel '+i.number+'? The original will remain in history and cannot be edited or reissued as the same number.'))return;i.status='Cancelled';i.cancelledAt=new Date().toISOString();i.cancelReason=reason.trim();i.auditTrail=Array.isArray(i.auditTrail)?i.auditTrail:[];i.auditTrail.push({at:i.cancelledAt,action:'Cancelled',details:reason.trim()});save();render()}

function viewInvoicePage(){const i=db.invoices.find(x=>x.id===selected);if(!i)return returnFromInvoice();if(i.categoryId==='water'&&i.water){$('app').innerHTML=`<section class="panel invoice-preview"><div class="actions no-print"><button class="alt" onclick="returnFromInvoice()">← Back</button><button onclick="window.print()">Print / Save PDF</button><button onclick="showInvoiceEmail()">Email Bill</button>${invoiceActions(i)}</div>${invoiceIsCancelled(i)?'<div class="cancelled-watermark">CANCELLED</div>':''}${waterBillMarkup(i)}${invoiceAuditMarkup(i)}</section>`;return}if((String(i.categoryId||'').toLowerCase()==='electricity'||String(i.number||'').startsWith('ELE-'))&&i.utility){$('app').innerHTML=`<section class="panel"><div class="actions no-print"><button class="alt" onclick="returnFromInvoice()">← Back</button><button onclick="window.print()">Print / Save PDF</button><button onclick="showInvoiceEmail()">Email Bill</button>${invoiceActions(i)}</div>${invoiceIsCancelled(i)?'<div class="cancelled-watermark">CANCELLED</div>':''}${electricityBillMarkup(i)}${invoiceAuditMarkup(i)}<p class="muted no-print">Issued bill ${esc(i.number)} · Saved locally in this browser.</p></section>`;return}$('app').innerHTML=`<section class="panel"><div class="actions no-print"><button class="alt" onclick="returnFromInvoice()">← ${invoiceReturnTenantId?'Tenant Billing & Invoices':directoryKind==='bill'?'All Bills':'All Invoices'}</button><button onclick="window.print()">Print / Save as PDF</button><button onclick="showInvoiceEmail()">Email Invoice</button>${invoiceActions(i)}</div>${invoiceIsCancelled(i)?'<div class="cancelled-watermark">CANCELLED</div>':''}<div class="invoice-sheet"><div class="invoice-doc-top"><div><div class="che-document-heading">${cheDocumentLogo()}<h2>INVOICE</h2></div>${issuerBlock(i)}</div><div class="invoice-doc-dates"><div><span>Invoice No.</span><b>${esc(i.number)}</b></div><div><span>Invoice Date</span><b>${esc(i.date)}</b></div><div><span>Billing Period</span><b>${esc(invoicePeriodLabel(i))}</b></div><div><span>Due Date</span><b>${esc(i.due||'—')}</b></div></div></div><div class="grid"><div><h3>Bill To:</h3><b>${esc(i.billTo.name)}</b><div class="preline">${esc(i.billTo.address)}</div><div>${esc(i.billTo.contact)}</div><div>${esc(i.billTo.phone)}</div><div>${esc(i.billTo.email)}</div></div><div><h3>Payment To:</h3><b>${esc(i.paymentTo.name)}</b><div class="preline">${esc(i.paymentTo.address)}</div><div>${esc(i.paymentTo.bank)} ${esc(i.paymentTo.branch)}</div><div>Account: ${esc(i.paymentTo.account)}</div><div class="preline">${esc(i.paymentTo.instructions)}</div></div></div><table class="table"><thead><tr><th>Description</th><th>Qty</th><th>Rate (LKR)</th><th>Amount (LKR)</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.description)}</td><td>${esc(l.qty)}</td><td>${money(l.rate)}</td><td>${money(l.amount)}</td></tr>`).join('')}</tbody></table><h2 style="text-align:right">Total: ${money(i.total)}</h2><div class="preline">${esc(i.notes)}</div></div><p class="muted no-print">Issued invoice snapshot · saved locally in this browser.</p>${invoiceAuditMarkup(i)}</section>`}
function showInvoiceEmail(){const i=db.invoices.find(x=>x.id===selected);if(!i)return;const tenant=db.tenants.find(t=>t.id===i.tenantId);const recipient=tenant?.email||i.billTo.email||'';const subject='CHE Holdings - Invoice '+i.number;const body='Dear '+(i.billTo.contact||i.billTo.displayName||i.billTo.name)+',\n\nPlease find attached invoice '+i.number+' dated '+i.date+' for LKR '+Number(i.total).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})+'.\n\nThank you,\nCHE Holdings';const existing=document.getElementById('invoiceEmailDialog');if(existing)existing.remove();const el=document.createElement('section');el.id='invoiceEmailDialog';el.className='panel no-print';el.style.marginTop='16px';el.innerHTML=`<h3>Send Invoice ${esc(i.number)}</h3><p>Recipient is loaded from the tenant profile. Direct sending requires the CHE Holdings email server to be configured.</p><label for="sendTo">To</label><input id="sendTo" type="email" value="${esc(recipient)}" placeholder="Tenant email address"><label for="sendSubject">Subject</label><input id="sendSubject" value="${esc(subject)}"><label for="sendBody">Message</label><textarea id="sendBody" rows="7">${esc(body)}</textarea><label for="emailServerUrl">CHE Holdings Email Server URL</label><input id="emailServerUrl" type="url" placeholder="https://your-server.example.com" value="${esc(localStorage.getItem('che_email_server_url')||'')}"><p class="muted">The server securely generates the PDF attachment and sends it. Do not enter API keys in this page.</p><div class="actions"><button type="button" id="directSendButton" onclick="sendInvoiceDirectly()">Send Invoice with PDF</button><button type="button" class="alt" onclick="window.print()">Save Invoice as PDF</button><button type="button" class="alt" onclick="document.getElementById('invoiceEmailDialog').remove()">Cancel</button></div><p id="sendInvoiceStatus" role="status" class="muted"></p>`;document.getElementById('app').appendChild(el);el.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function sendInvoiceDirectly(){const i=db.invoices.find(x=>x.id===selected);if(!i)return;const url=document.getElementById('emailServerUrl').value.trim().replace(/\/+$/,'');const to=document.getElementById('sendTo').value.trim(),subject=document.getElementById('sendSubject').value.trim(),message=document.getElementById('sendBody').value;const status=document.getElementById('sendInvoiceStatus'),button=document.getElementById('directSendButton');if(!url||!/^https?:\/\//.test(url))return status.textContent='Enter a valid email server URL.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return status.textContent='Enter a valid recipient email.';if(!subject)return status.textContent='Enter an email subject.';localStorage.setItem('che_email_server_url',url);button.disabled=true;status.textContent='Sending invoice and PDF attachment…';try{const response=await fetch(url+'/api/send-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invoice:i,to,subject,message})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'Email server rejected the request');i.emailLog=Array.isArray(i.emailLog)?i.emailLog:[];i.emailLog.push({to,at:new Date().toISOString(),messageId:data.messageId||'',status:'accepted'});save();status.textContent='Email accepted by the email provider. Delivery to the recipient is not yet confirmed.';}catch(err){status.textContent='Unable to send: '+err.message+' Check the server URL, configuration and connection.';}finally{button.disabled=false}}
function openInvoiceEmail(){const to=document.getElementById('sendTo').value.trim(),subject=document.getElementById('sendSubject').value,body=document.getElementById('sendBody').value;if(!to||!document.getElementById('sendTo').checkValidity())return appNotice('Please enter a valid recipient email address.');window.location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='che-dashboard-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restoreFile(input){const file=input.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.tenants)||!Array.isArray(obj.managers))throw Error('Invalid backup');if(!await appConfirm('Replace existing test data with this backup?'))return;db=obj;db.invoices=Array.isArray(db.invoices)?db.invoices:[];db.billCategories=Array.isArray(db.billCategories)?db.billCategories:[];for(const c of [{id:'invoice',name:'Invoice',system:true},{id:'electricity',name:'Electricity',system:true},{id:'water',name:'Water',system:true}])if(!db.billCategories.some(x=>x.id===c.id))db.billCategories.unshift(c);for(const i of db.invoices)if(!i.categoryId)i.categoryId='invoice';db.billCategories=Array.isArray(db.billCategories)?db.billCategories:[];for(const c of [{id:'invoice',name:'Invoice',system:true},{id:'electricity',name:'Electricity',system:true},{id:'water',name:'Water',system:true}])if(!db.billCategories.some(x=>x.id===c.id))db.billCategories.unshift(c);for(const i of db.invoices)if(!i.categoryId)i.categoryId='invoice';db.nextInvoice=db.nextInvoice||1;db.units=Array.isArray(db.units)?db.units:seed().units;db.nextUnit=db.nextUnit||db.units.length+1;save();selected='';render()}catch(e){appNotice(e.message)}}render();</script></html>
